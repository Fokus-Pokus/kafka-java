spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:kafka-relay-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    properties:
      sasl.mechanism: PLAIN
      security.protocol: SASL_SSL
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";
      ssl.truststore.location: ${KAFKA_TRUSTSTORE_PATH}
      ssl.truststore.password: ${KAFKA_TRUSTSTORE_PASSWORD}
      ssl.truststore.type: JKS

app:
  kafka:
    input-topic: ${KAFKA_INPUT_TOPIC:input-topic}
    output-topic: ${KAFKA_OUTPUT_TOPIC:output-topic}
    max-messages-per-second: ${KAFKA_MAX_MESSAGES_PER_SECOND:0}
  mapping:
    key-path: ${KAFKA_KEY_PATH:messageId}
    fields:
      requestId: messageId
      userId: payload.user.id
      eventType: payload.eventType
